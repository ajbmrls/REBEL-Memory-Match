<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REBEL Match">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>REBEL Memory Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one centered column sized to fit the screen height, so the 4x2 grid never scrolls on a tablet. */
:root{
  --blue:#23609A; --ink:#1F2A36; --bg:#DEEAF1; --surface:#ffffff; --muted:#4A5A6A; --line:#B9D0E0; --deep:#23609A; --green:#34c759; --on-green:#06310f; --scrim:rgba(222,234,241,.72);
  --font:"Barlow Condensed","Trade Gothic Next Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#eaf2fa;--bg:#0e1c2a;--surface:#ffffff;--muted:#9db4c9;--line:#284259;--deep:#97BFE2;--green:#30d158;--scrim:rgba(14,28,42,.72);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eaf2fa;--bg:#0e1c2a;--surface:#ffffff;--muted:#9db4c9;--line:#284259;--deep:#97BFE2;--green:#30d158;--scrim:rgba(14,28,42,.72);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding-inline:16px;padding-block:20px;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:max(300px,min(1100px,calc((100vh - 230px) * 1.5)));margin-inline:auto;display:flex;flex-direction:column;gap:clamp(12px,2vh,20px)}
header{display:flex;align-items:center;gap:14px}
header img{height:clamp(22px,3.6vw,36px);width:auto;flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header img{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] header img{filter:brightness(0) invert(1)}
h1{margin:0;font-size:clamp(1.6rem,4.6vw,2.8rem);font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:.02em;color:var(--deep);flex:1;min-width:0;text-align:right}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:clamp(14px,3vw,28px);font-size:clamp(.85rem,1.7vw,1.05rem);text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:600}
.stats span{display:flex;flex-direction:column;gap:2px}
.stats span:first-child{min-width:7ch}
.stats b{color:var(--ink);font-size:clamp(1.6rem,3.8vw,2.4rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1}
button.go{font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(1rem,2.2vw,1.3rem);background:var(--blue);color:#fff;border:0;border-radius:999px;padding:14px 26px;min-height:48px;min-width:150px;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}
button.go{transition:transform .1s ease-out,background-color .2s ease}
button.go:active:not(:disabled){transform:scale(.96)}
button.go.ready{background:var(--green);color:var(--on-green)}
button.go:disabled{background:var(--line);color:var(--muted);cursor:default}
button:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.8vw,18px);perspective:1200px}
.card{aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.3,1);border-radius:clamp(10px,1.6vw,18px);font:inherit;color:inherit;touch-action:manipulation;container-type:inline-size}
.card.up{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;overflow:hidden}
.back{background:var(--blue) url(illustrations/rebel-wordmark-white.png) center/62% auto no-repeat}
.front{background:var(--surface);border:2px solid #B9D0E0;transform:rotateY(180deg);color:#23609A}
.front svg{width:50%;height:auto}
.front img{width:78%;height:56%;object-fit:contain}
.front svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.front span{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14cqw;line-height:1;color:#23609A}
.card.done .front{background:var(--green);border-color:var(--green);color:var(--on-green);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.card.done .front span{color:var(--on-green)}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}
.grid:not(.locked) .card:not(.up):active .back{transform:scale(.96)}
.back{transition:transform .1s ease-out}
.stage{position:relative}
.count{position:absolute;inset:-8px;display:flex;align-items:center;justify-content:center;pointer-events:none;border-radius:20px;background:var(--scrim);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s ease}
.count.on{opacity:1}
.count b{font-size:clamp(6rem,34vh,18rem);font-weight:700;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums}
.count b.tick{animation:tick .9s cubic-bezier(.2,.8,.2,1) both}
.count b.go{color:var(--green);text-transform:uppercase}
@keyframes tick{0%{transform:scale(.7);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.04);opacity:.0}}
@media (prefers-reduced-transparency:reduce){.count{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}}
.grid.locked .card,.card.done{cursor:default}
@media (prefers-reduced-motion:reduce){.card,.back,button.go{transition:none}.card.done .front,.count b.tick{animation:none}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="illustrations/rebel-wordmark-black.png" alt="REBEL">
    <h1>Memory Match</h1>
  </header>
  <div class="bar">
    <div class="stats"><span>Time<b id="time">0:00.00</b></span><span>Moves<b id="moves">0</b></span><span>Pairs<b id="pairs">0/4</b></span></div>
    <button class="go" id="go" type="button" disabled>Memorize 7</button>
  </div>
  <div class="stage"><div class="grid locked" id="grid"></div><div class="count" id="count" aria-live="assertive"><b id="num"></b></div></div>
</div>
<script>
/* Each pair uses a REBEL illustration (img); without img it falls back to the drawn icon in p. */
const SET=[
 {k:'Stress less',img:'illustrations/stressed-at-desk.png'},
 {k:'Talk it out',img:'illustrations/talking-it-through.png'},
 {k:'Healthy mind',img:'illustrations/strong-mind.png'},
 {k:'Move',img:'illustrations/runner.png'}
];
const PREVIEW=7,$=id=>document.getElementById(id),grid=$('grid'),go=$('go');
let open=[],moves=0,pairs=0,lock=true,phase='',t0=0,tick=0,cd=0;
const count=$('count'),num=$('num');
function show(t,go){num.className='';void num.offsetWidth;num.textContent=t;num.className='tick'+(go?' go':'')}
const fmt=ms=>{const c=Math.floor(ms/10),s=Math.floor(c/100);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'.'+String(c%100).padStart(2,'0')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  clearInterval(tick);clearInterval(cd);count.classList.remove('on');go.classList.remove('ready');
  open=[];moves=0;pairs=0;lock=true;phase='preview';
  $('moves').textContent=0;$('pairs').textContent='0/4';$('time').textContent='0:00.00';
  grid.classList.add('locked');grid.innerHTML='';
  shuffle([...SET,...SET]).forEach(c=>{
    const b=document.createElement('button');b.type='button';b.className='card up';b.dataset.k=c.k;b.setAttribute('aria-label',c.k);
    const art=c.img?'<img src="'+c.img+'" alt="">':'<svg viewBox="0 0 24 24" aria-hidden="true">'+c.p+'</svg>';
    b.innerHTML='<div class="face back"></div><div class="face front">'+art+'<span>'+c.k+'</span></div>';
    b.onpointerdown=e=>{if(e.button===0)flip(b)};b.onclick=e=>{if(e.detail===0)flip(b)};grid.appendChild(b);
  });
  let n=PREVIEW;go.disabled=true;go.textContent='Memorize '+n;
  cd=setInterval(()=>{
    if(--n>0){go.textContent='Memorize '+n;return}
    clearInterval(cd);
    grid.querySelectorAll('.card').forEach(b=>{b.classList.remove('up');b.setAttribute('aria-label','Face down card')});
    phase='ready';go.disabled=false;go.textContent='Ready';go.classList.add('ready');
  },1000);
}
function ready(){
  phase='count';go.disabled=true;go.classList.remove('ready');go.textContent='Get set';
  let n=3;count.classList.add('on');show(n);
  cd=setInterval(()=>{
    if(--n>0){show(n);return}
    clearInterval(cd);show('Go',true);begin();
    setTimeout(()=>{if(phase!=='count')count.classList.remove('on')},600);
  },1000);
}
function begin(){
  phase='play';lock=false;go.disabled=false;grid.classList.remove('locked');go.textContent='New game';
  t0=performance.now();tick=setInterval(()=>{$('time').textContent=fmt(performance.now()-t0)},31);
}
function flip(b){
  if(lock||phase!=='play'||b.classList.contains('up'))return;
  b.classList.add('up');b.setAttribute('aria-label',b.dataset.k);open.push(b);
  if(open.length<2)return;
  $('moves').textContent=++moves;
  const [a,d]=open;open=[];
  if(a.dataset.k===d.dataset.k){
    a.classList.add('done');d.classList.add('done');$('pairs').textContent=(++pairs)+'/4';
    if(pairs===4){clearInterval(tick);$('time').textContent=fmt(performance.now()-t0);phase='won';go.textContent='Play again'}
  }else{
    lock=true;setTimeout(()=>{[a,d].forEach(x=>{x.classList.remove('up');x.setAttribute('aria-label','Face down card')});lock=false},850);
  }
}
go.onclick=()=>phase==='ready'?ready():start();
start();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
